apis:
- aid: stockx:stockx-batch-api
  name: StockX Batch API
  description: >-
    Batch APIs enable a user to create, update, delete listings in bulk. Batch APIs are asynchronous in
    nature and we provide mechanisms to poll the API so that you can keep track of the batch completion.  Once
    a batch is successfully completed, you can view the status of each individual listing.  We track each
    individual listing inside a batch separately so you can have scenarios where some listings succeed
    and some fail in a single batch.
  humanURL: https://developer.stockx.com/
  baseURL: https://api.stockx.com/v2
  tags:
  - Batch
  properties:
  - type: OpenAPI
    url: openapi/stockx-batch-api-openapi.yml
  - type: APIReference
    url: https://developer.stockx.com/portal/api-reference
- aid: stockx:stockx-catalog-api
  name: StockX Catalog API
  description: >-
    The StockX Catalog API provides a means for partners to search for catalog data, and request products
    to be added. Partners can search our Catalog to get StockX product and variant IDs for various purposes.
    Access to the Catalog Ingestion API is approved on a request-by-request basis.
  humanURL: https://developer.stockx.com/
  baseURL: https://api.stockx.com/v2
  tags:
  - Catalog
  properties:
  - type: OpenAPI
    url: openapi/stockx-catalog-api-openapi.yml
  - type: APIReference
    url: https://developer.stockx.com/portal/api-reference
- aid: stockx:stockx-listings-api
  name: StockX Listings API
  description: >-
    Listings APIs enable a seller to programmatically sell on StockX. The APIs enable a user to  create,
    update and delete listings on the marketplace, as well as view and fetch live market data for any
    live or expired listings you have
  humanURL: https://developer.stockx.com/
  baseURL: https://api.stockx.com/v2
  tags:
  - Listings
  properties:
  - type: OpenAPI
    url: openapi/stockx-listings-api-openapi.yml
  - type: APIReference
    url: https://developer.stockx.com/portal/api-reference
- aid: stockx:stockx-order-api
  name: StockX Order API
  description: >-
    Order APIs enable a user to view all their active orders / sales as well as details for a single order.
  humanURL: https://developer.stockx.com/
  baseURL: https://api.stockx.com/v2
