aid: stockx
name: StockX
description: >-
  StockX is a global online marketplace for sneakers, streetwear, electronics, collectibles,
  and trading cards, operating on a live bid/ask model similar to a stock exchange. The StockX
  Public API (v2.0.0) lets approved developers in the StockX Developer Program search the product
  catalog, read live market data (bids/asks), create and manage seller listings individually or in
  bulk via asynchronous batch operations, and track sales orders and their shipping documents.
  Requests authenticate with an x-api-key header plus an OAuth 2.0 bearer token issued by StockX's
  Auth0 tenant. StockX was surfaced as a portfolio company of Battery Ventures and GV.
