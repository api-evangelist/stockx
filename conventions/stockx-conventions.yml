    params: [cursor, pageSize]
    applies_to: ['selling/listings/{listingId}/operations']
async_operations:
  detail: Bulk listing changes are asynchronous. POST create/update/delete-listing return a batchId; poll GET .../batch/{batchId} and .../items for per-item status. Single-listing writes return an operation that can be polled at selling/listings/{listingId}/operations/{operationId}.
