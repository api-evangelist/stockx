authentication:
  style: api-key + oauth2-bearer
  detail: Every request requires an x-api-key header AND an Authorization Bearer JWT (Auth0). See authentication/stockx-authentication.yml.
idempotency:
  supported: false
  detail: No idempotency-key header is documented. Write operations (listing create/update/delete) are made safe via asynchronous batch operations with server-issued batchId and per-item status polling rather than client idempotency keys.
pagination:
  styles:
