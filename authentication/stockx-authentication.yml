notes: >-
  StockX Public API requires BOTH an x-api-key header AND an OAuth 2.0 bearer
  access token on every request. Access tokens are issued by StockX's Auth0
  tenant (accounts.stockx.com) via the Authorization Code flow; the audience
  must be set to gateway.stockx.com. The API key is generated in the developer
  portal once developer-program access is approved.
